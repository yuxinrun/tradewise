<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>页面加载中… - TradeWise</title>
  <script>
    // GitHub Pages SPA 路由兼容：将子路径编码到查询参数，再由 index.html 还原
    (function () {
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <p>正在加载 TradeWise 页面，请稍候。<a href="/tradewise/">返回首页</a></p>
</body>
</html>

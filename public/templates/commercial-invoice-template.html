<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commercial Invoice Template - TradeWise</title>
<style>
  body{font-family:Arial,"Microsoft YaHei",sans-serif;color:#16283b;max-width:900px;margin:32px auto;padding:0 24px;line-height:1.6}
  h1{color:#0b2a4a;border-bottom:3px solid #0b2a4a;padding-bottom:8px;font-size:26px}
  .row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
  .col{flex:1;min-width:220px}
  label{display:block;font-size:12px;color:#6b7c90;font-weight:bold;margin-bottom:4px}
  input,textarea{width:100%;border:none;border-bottom:1px solid #cfd8e3;padding:6px 0;font-size:14px;outline:none;font-family:inherit}
  table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}
  th{background:#0b2a4a;color:#fff;padding:10px;text-align:left}
  td{border-bottom:1px solid #e4e9f0;padding:10px}
  .note{background:#f1f4f8;padding:14px;border-radius:6px;font-size:13px;color:#52657a}
</style>
</head>
<body>
<h1>COMMERCIAL INVOICE</h1>
<div class="row">
  <div class="col"><label>Invoice No.</label><input></div>
  <div class="col"><label>Invoice Date</label><input type="date"></div>
  <div class="col"><label>Contract / PI No.</label><input></div>
</div>
<div class="row">
  <div class="col"><label>Seller (Exporter)</label><textarea rows="3"></textarea></div>
  <div class="col"><label>Buyer (Importer)</label><textarea rows="3"></textarea></div>
</div>
<table>
  <thead><tr><th>No.</th><th>Description of Goods</th><th>HS Code</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead>
  <tbody>
    <tr><td>1</td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td>2</td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
  </tbody>
</table>
<div class="row">
  <div class="col"><label>Currency</label><input value="USD"></div>
  <div class="col"><label>Total Amount</label><input></div>
  <div class="col"><label>Country of Origin</label><input value="China"></div>
</div>
<div class="row">
  <div class="col"><label>Price Term</label><input placeholder="CIF Hamburg, Incoterms® 2020"></div>
  <div class="col"><label>Port of Loading</label><input></div>
  <div class="col"><label>Port of Destination</label><input></div>
</div>
<div class="row">
  <div class="col"><label>Freight (if separately stated)</label><input></div>
  <div class="col"><label>Insurance (if separately stated)</label><input></div>
  <div class="col"><label>B/L or AWB No.</label><input></div>
</div>
<p class="note">Declare true description, quantity and value. Under-declaring or misdeclaring may lead to penalties or detention. HS Code must match the customs declaration. Template: TradeWise · 内容更新时间 2026-11-15.</p>
<div style="text-align:right;margin-top:40px"><label>Seller Signature / Stamp</label><div style="border-top:1px solid #16283b;width:240px;margin-left:auto"></div></div>
</body>
</html>

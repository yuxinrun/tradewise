<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation Template - TradeWise</title>
<style>
  body{font-family:Arial,"Microsoft YaHei",sans-serif;color:#16283b;max-width:900px;margin:32px auto;padding:0 24px;line-height:1.6}
  h1{color:#0b2a4a;border-bottom:3px solid #0b2a4a;padding-bottom:8px;font-size:28px}
  .row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
  .col{flex:1;min-width:220px}
  label{display:block;font-size:12px;color:#6b7c90;font-weight:bold;margin-bottom:4px}
  input,textarea{width:100%;border:none;border-bottom:1px solid #cfd8e3;padding:6px 0;font-size:14px;outline:none;font-family:inherit}
  table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px}
  th{background:#0b2a4a;color:#fff;padding:10px;text-align:left}
  td{border-bottom:1px solid #e4e9f0;padding:10px}
  .note{background:#f1f4f8;padding:14px;border-radius:6px;font-size:13px;color:#52657a}
  .signature{margin-top:48px;text-align:right}
  @media print{body{margin:0}.noprint{display:none}}
</style>
</head>
<body>
<h1>QUOTATION</h1>
<div class="row">
  <div class="col"><label>Quotation No.</label><input value="QT-2026-001"></div>
  <div class="col"><label>Date</label><input type="date"></div>
  <div class="col"><label>Validity</label><input value="15 days from the date above"></div>
</div>
<div class="row">
  <div class="col"><label>From (Seller)</label><textarea rows="3" placeholder="Company name, address, contact"></textarea></div>
  <div class="col"><label>To (Buyer)</label><textarea rows="3" placeholder="Company name, contact"></textarea></div>
</div>
<table>
  <thead><tr><th>No.</th><th>Product & Specification</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Amount</th></tr></thead>
  <tbody>
    <tr><td>1</td><td><input placeholder="Product name / model"></td><td><input></td><td><input value="pcs"></td><td><input placeholder="USD 0.00"></td><td><input></td></tr>
    <tr><td>2</td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td>3</td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
  </tbody>
</table>
<div class="row">
  <div class="col"><label>Total Amount</label><input placeholder="USD 0.00"></div>
  <div class="col"><label>Price Term</label><input placeholder="FOB Shenzhen, Incoterms® 2020"></div>
  <div class="col"><label>Packing</label><input></div>
</div>
<div class="row">
  <div class="col"><label>Payment Terms</label><input placeholder="30% T/T deposit, 70% before shipment"></div>
  <div class="col"><label>Lead Time</label><input></div>
  <div class="col"><label>Port of Loading</label><input></div>
</div>
<p class="note">This quotation is subject to our final confirmation. Price term must be stated with a named place and Incoterms® 2020. Please review all costs before sending. Template: TradeWise 外贸实战学院 · 内容更新时间 2026-11-17.</p>
<div class="signature"><label>Authorized Signature</label><div style="border-top:1px solid #16283b;width:240px;margin-left:auto"></div></div>
</body>
</html>

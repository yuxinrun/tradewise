<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="出口物流流程图：工厂、拖车、港口、海运、目的港、清关与收货">
  <rect width="1000" height="300" fill="#f7f9fc"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="bold" fill="#0b2a4a">出口物流与交付流程</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g fill="#0b2a4a">
      <rect x="30" y="90" width="125" height="80" rx="8"/><rect x="195" y="90" width="125" height="80" rx="8"/>
      <rect x="360" y="90" width="125" height="80" rx="8"/><rect x="525" y="90" width="125" height="80" rx="8"/>
      <rect x="690" y="90" width="125" height="80" rx="8"/><rect x="855" y="90" width="115" height="80" rx="8"/>
    </g>
    <g fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">
      <text x="92" y="128">工厂</text><text x="92" y="150" font-size="10" fill="#a8c4d8">生产与验货</text>
      <text x="257" y="128">拖车进仓</text><text x="257" y="150" font-size="10" fill="#a8c4d8">国内运输</text>
      <text x="422" y="128">出口报关</text><text x="422" y="150" font-size="10" fill="#a8c4d8">申报放行</text>
      <text x="587" y="128">国际运输</text><text x="587" y="150" font-size="10" fill="#a8c4d8">海运/空运</text>
      <text x="752" y="128">目的港清关</text><text x="752" y="150" font-size="10" fill="#a8c4d8">进口手续</text>
      <text x="912" y="128">客户收货</text><text x="912" y="150" font-size="10" fill="#a8c4d8">交付确认</text>
    </g>
    <g stroke="#d96a1a" stroke-width="2" fill="none">
      <path d="M155 130h40M320 130h40M485 130h40M650 130h40M815 130h40"/>
    </g>
    <g fill="#d96a1a">
      <path d="M193 126l8 4-8 4zM358 126l8 4-8 4zM523 126l8 4-8 4zM688 126l8 4-8 4zM853 126l8 4-8 4z"/>
    </g>
    <text x="500" y="230" text-anchor="middle" font-size="13" fill="#52657a">卖方责任区间（FOB）：工厂 → 装船前　｜　买方责任区间：装船后 → 收货</text>
    <text x="500" y="260" text-anchor="middle" font-size="12" fill="#6b7c90">风险转移点：货物装上船时（FOB / CFR / CIF，Incoterms® 2020）</text>
  </g>
</svg>
